<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avalon</title>
  <!-- Font gotico da Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <!-- Includi Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1></h1>

        <ul id="playerList" style="list-style: none; padding: 0; margin: 0;">
        </ul>
    <br>
    <h2>Aspettando l'host</h2>
  </div>

<script>
const playerList = document.getElementById('playerList');
  
const supabaseUrl = 'https://ctnkeyycsbhadytnglbj.supabase.co';
const supabaseKey = 'sb_publishable_CEVeeu7p1k-MvdqxIoOZtA_J_M_I79b';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
const params = new URLSearchParams(window.location.search);
const roomCode = params.get('roomCode');
const nickname = params.get('player');
let stop = 0;

const title = document.querySelector('h1');
if (roomCode) {
  title.textContent = 'Sala di Avalon: ' + roomCode;
} else {
  title.textContent = 'Sala di Avalon';
}

async function updatePlayers() {
  if (!roomCode || stop) return;
  
  const { data, error } = await supabase
    .from('players')
    .select('*')
    .eq('room', roomCode)
    .order('name');
    
  if (error) {
    console.error('Errore nel recupero dei giocatori:', error);
    return;
  }
  
  playerList.innerHTML = '';
  data.forEach(player => {
    const li = document.createElement('li');
    li.textContent = player.name;
    li.style.fontSize = '1.8rem';
    li.style.padding = '8px';
    li.style.margin = '5px 0';
    li.style.backgroundColor = 'rgba(107, 62, 38, 0.5)';
    li.style.borderRadius = '5px';
    playerList.appendChild(li);
  });
}

async function checkRoomStatus() {
  if (!roomCode) return;
  
  const { data: roomData, error } = await supabase
    .from('rooms_id')
    .select('*')
    .eq('room_code', roomCode)
    .single();
    
  if (error) {
    console.error('Errore recuperando lo status della stanza:', error);
    return;
  }
  
  if (roomData.status) {
    stop = 1; 
    window.location.replace("game.html?roomCode=" + roomCode + "&player=" + nickname);
  }
}

updatePlayers();
checkRoomStatus();

supabase
  .channel('players-room-' + roomCode)
  .on('postgres_changes', { 
    event: '*', 
    schema: 'public', 
    table: 'players', 
    filter: `room=eq.${roomCode}` 
  }, payload => {
    console.log('Aggiornamento giocatori:', payload);
    updatePlayers();
  })
  .subscribe();

supabase
  .channel('room-status-' + roomCode)
  .on('postgres_changes', { 
    event: 'UPDATE', 
    schema: 'public', 
    table: 'rooms_id', 
    filter: `room_code=eq.${roomCode}` 
  }, payload => {
    console.log('Aggiornamento stanza:', payload);
    checkRoomStatus();
  })
  .subscribe();
</script>


</body>
</html>
