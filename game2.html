<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avalon</title>
  <!-- Font gotico da Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <!-- Includi Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="variabili.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>

    .player-item {
      font-size: 1.8rem;
      padding: 8px;
      margin: 5px 0;
      background-color: rgba(107, 62, 38, 0.5);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

	@media (hover: hover) and (pointer: fine) {
	  .player-item:hover {
	    background-color: rgba(150, 90, 50, 0.7);
	  }
	}

    .selected {
      background-color: rgba(255, 215, 0, 0.7);
      color: #000;
      font-weight: bold;
      text-shadow: none;
    }

    .button:disabled {
  background-color: #3e1f10; /* colore più scuro */
  border-color: #5a3e2b;
  color: #999; /* testo più spento */
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

/* Disabilita l'hover quando il bottone è disabilitato */
.button:disabled:hover {
  background-color: #3e1f10; /* stesso colore di default per disabled */
  box-shadow: none;
  transform: none;
}

.vote-icon {
  width: 100px;
  height: 100px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
  border-radius: 5px; /* Opzionale, per arrotondare */
}

.vote-icon:hover {
  transform: scale(1.1);
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
}

.selected-vote {
  transform: scale(1.3);
  box-shadow: 0 0 20px gold, 0 0 40px gold;
}


  </style>
</head>
<body>
  <div class="container">
    <h1></h1>
    <h2></h2>
    <ul id="playerList" style="list-style: none; padding: 0; margin: 0;">
    </ul>
    <br>
    <button class="button" id="conferma" disabled style="visibility: hidden;">Conferma</button>
  </div>

<script>
const confermaButton = document.getElementById('conferma');
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        confermaButton.click();
    }
});

const supabaseUrl = 'https://ctnkeyycsbhadytnglbj.supabase.co';
const supabaseKey = 'sb_publishable_CEVeeu7p1k-MvdqxIoOZtA_J_M_I79b';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

const params = new URLSearchParams(window.location.search);
const roomCode = params.get('roomCode');
const nickname = params.get('player');
let playersData = [];
let missionPlayers = [];

let round = 0;
let level = 0;

// ===== VARIABILI GLOBALI PER LE SUBSCRIPTIONS =====
let roundChangeSub = null;           // Interval 5
let missionSelectedSub = null;       // Interval 1
let voteApproveRejectSub = null;     // Interval 2
let missionStatusSub = null;         // Interval 3
let missionResultSub = null;         // Interval 4

// ===== FLAG PER EVITARE ESECUZIONI MULTIPLE =====
let alreadyProcessedMissionSelection = false;
let alreadyProcessedVoting = false;
let alreadyProcessedMissionStart = false;
let alreadyProcessedMissionResult = false;

async function readRound() {
  try {
    const { data, error } = await supabase
      .from('rooms_id')
      .select('round')
      .eq('room_code', roomCode);

    if (error) {
      console.error('Errore nella query:', error);
      return 0;
    } else {
      return data[0]?.round || 0;
    }
  } catch (err) {
    console.error('Errore:', err);
    return 0;
  }
}

async function setRound() {
  try {
    const newRound = (round + 1)%playersData.length;
    
    const { data, error } = await supabase
      .from('rooms_id')
      .update({ round: newRound })
      .eq('room_code', roomCode);

    if (error) {
      console.error('Errore nella query:', error);
      return 0;
    } else {
      round = newRound;
      return newRound;
    }
  } catch (err) {
    console.error('Errore:', err);
    return 0;
  }
}

async function getPlayersByRoom() {
  try {
    const { data, error } = await supabase
      .from('players')
      .select('name, role')
      .eq('room', roomCode)
      .order('name');

    if (error) {
      console.error('Errore nella query:', error);
      playersData = [];
    } else {
      playersData = data;
    }
  } catch (err) {
    console.error('Errore:', err);
    playersData = [];
  }
}

async function checkPlayersStatus() {
  if (!roomCode) return 0;

  try {
    const { data, error } = await supabase
      .from('players')
      .select('name')
      .eq('mission', true)
      .eq('room', roomCode)
      .order('name');

    if (error) {
      console.error('Errore nel recupero dei giocatori:', error);
      return 0;
    }

    missionPlayers = data.map(p => p.name);
    missionPlayers.sort((a, b) => a.localeCompare(b, 'it', { sensitivity: 'base' }));

    return missionPlayers.length;
  } catch (err) {
    console.error('Errore nella funzione checkPlayersStatus:', err);
    return 0;
  }
}

async function setStatusVoted(roomCode, nickname, res) {
  try {
    const { data, error } = await supabase
      .from('players')
      .update({ status: res })
      .eq('room', roomCode)
      .eq('name', nickname)
      .select();

    if (error) throw error;

    if (!data || data.length != 1) {
      console.log("Nessun player trovato con quel roomCode e nomi corrispondenti");
      return false;
    }

    console.log("Status aggiornato a 'selected' per i giocatori:", missionPlayers);
    return true;
  } catch (err) {
    console.error("Errore aggiornando lo status:", err);
    return null;
  }
}

async function checkPlayersStatus2() {
  if (!roomCode) return false;

  try {
    const { data, error } = await supabase
      .from('players')
      .select('status')
      .eq('room', roomCode)
      .order('name');

    if (error) {
      console.error('Errore nel recupero dei giocatori:', error);
      return false;
    }

    if (!data || data.length === 0) return false;

    const allVoted = data.every(player => player.status === 'approve' || player.status === 'reject');
    if (!allVoted) return false;

    const approveCount = data.filter(player => player.status === 'approve').length;
    const rejectCount = data.filter(player => player.status === 'reject').length;

    const { data: updateData, error: updateError } = await supabase
      .from('rooms_id')
      .update({ 
        votes: [approveCount, rejectCount]
      })
      .eq('room_code', roomCode)
      .select();

    if (updateError) {
      console.error('Errore nell\'aggiornamento dei voti:', updateError);
      return false;
    }

    return approveCount > rejectCount ? 1 : 2;

  } catch (err) {
    console.error('Errore nella funzione checkPlayersStatus2:', err);
    return false;
  }
}

async function checkPlayersStatus3() {
  if (!roomCode) return false;

  try {
    const { data, error } = await supabase
      .from('players')
      .select('*')
      .eq('status', 'mission')
      .eq('room', roomCode)
      .order('name');

    if (error) {
      console.error('Errore nel recupero dei giocatori:', error);
      return false;
    }

    return data.length;
  } catch (error) {
    console.error('Errore nella funzione checkPlayersStatus3:', error);
    return false;
  }
}

async function checkPlayersStatus4() {
  if (!roomCode) return false;

  try {
    const { data, error } = await supabase
      .from('players')
      .select('status')
      .eq('room', roomCode)
      .in('name', missionPlayers);

    if (error) {
      console.error('Errore nel recupero dei giocatori:', error);
      return false;
    }

    if (!data || data.length === 0) return false;

    const allValid = data.every(player => player.status === 'success' || player.status === 'failure');

    if (!allValid) return false;

    const approveCount = data.filter(player => player.status === 'success').length;
    const rejectCount = data.filter(player => player.status === 'failure').length;

    const { data: currentRoom, error: fetchError } = await supabase
      .from('rooms_id')
      .select('results')
      .eq('room_code', roomCode)
      .single();

    if (fetchError) throw fetchError;

    const { data: updateData, error: updateError } = await supabase
      .from('rooms_id')
      .update({
        votes: [approveCount, rejectCount],
        results: [...(currentRoom.results || []), rejectCount < (1 + ((playersData.length > 6 && currentRoom.results.length === 3) ? 1 : 0))]
      })
      .eq('room_code', roomCode)
      .select();

    return true;

  } catch (err) {
    console.error('Errore nella funzione checkPlayersStatus4:', err);
    return false;
  }
}

async function getRoomVotes() {
  if (!roomCode) return null;

  try {
    const { data, error } = await supabase
      .from('rooms_id')
      .select('votes')
      .eq('room_code', roomCode)
      .single();

    if (error) {
      console.error('Errore nel recupero dei voti:', error);
      return null;
    }

    return data?.votes || null;

  } catch (err) {
    console.error('Errore nella funzione getRoomVotes:', err);
    return null;
  }
}

let missionPlayed = false;
async function playMission()
{
  if (missionPlayed) return;
  missionPlayed = true;
  const playerList = document.getElementById('playerList');
  playerList.innerHTML = '';

  const title2 = document.querySelector('h2');
  const votes = await getRoomVotes();
  
  if (missionPlayers.includes(nickname))
  {
    title2.innerHTML = 
    "Missione approvata con " + votes[0] + " voti favorevoli e " + votes[1] + " voti contrari.<br>" +
    "Vuoi far fallire la missione con " + missionPlayers.join(", ") + "?";
    
    const voteContainer = document.createElement('div');
    voteContainer.style.display = 'flex';
    voteContainer.style.justifyContent = 'center';
    voteContainer.style.gap = '50px';
    voteContainer.style.marginTop = '30px';

    const gold = document.createElement('img');
    gold.src = 'gold.png';
    gold.alt = 'Approva';
    gold.classList.add('vote-icon');

    const bronze = document.createElement('img');
    bronze.src = 'bronze.png';
    bronze.alt = 'Rifiuta';
    bronze.classList.add('vote-icon');

    voteContainer.appendChild(gold);
    voteContainer.appendChild(bronze);
    playerList.appendChild(voteContainer);

    const confirmVoteBtn = document.createElement('button');
    confirmVoteBtn.textContent = "Conferma voto";
    confirmVoteBtn.classList.add('button');
    confirmVoteBtn.disabled = true;
    confirmVoteBtn.style.marginTop = '30px';
    playerList.appendChild(confirmVoteBtn);

    let selectedVote = null;
    [gold, bronze].forEach(img => {
      img.addEventListener('click', () => {
        gold.classList.remove('selected-vote');
        bronze.classList.remove('selected-vote');
        img.classList.add('selected-vote');
        selectedVote = img === gold ? 'success' : 'failure';
        confirmVoteBtn.disabled = false;
      });
    });
    
    confirmVoteBtn.addEventListener('click', async () => {
      console.log("Hai votato:", selectedVote);
      confirmVoteBtn.disabled = true;
      confirmVoteBtn.textContent = "Voto inviato!";
      confirmVoteBtn.remove();
      
      if (selectedVote === "success")
        title2.innerHTML = 
        "Missione approvata con " + votes[0] + " voti favorevoli e " + votes[1] + " voti contrari.<br>" +
        "Hai votato per far riuscire la missione con " + missionPlayers.join(", ") + ".";
      else
        title2.innerHTML = 
        "Missione approvata con " + votes[0] + " voti favorevoli e " + votes[1] + " voti contrari.<br>" +
        "Hai votato per far fallire la missione con " + missionPlayers.join(", ") + ".";
      
      gold.style.pointerEvents = 'none';
      bronze.style.pointerEvents = 'none';
      
      const success4 = await setStatusVoted(roomCode, nickname, selectedVote);
      
      if (missionPlayers[0] === nickname)
      {
        async function checkAndProceedMissionResult() {
          if (alreadyProcessedMissionResult) return;
          
          const result4 = await checkPlayersStatus4();
          if (result4) {
            alreadyProcessedMissionResult = true;
            
            if (missionResultSub) {
              await supabase.removeChannel(missionResultSub);
              missionResultSub = null;
            }
            
            if (roundChangeSub) {
              await supabase.removeChannel(roundChangeSub);
              roundChangeSub = null;
            }
            
            const check2 = await setRound();
            window.location.replace("result.html?roomCode=" + roomCode + "&player=" + nickname);
          }
        }

        missionResultSub = supabase
          .channel('mission-result-' + roomCode)
          .on(
            'postgres_changes',
            {
              event: 'UPDATE',
              schema: 'public',
              table: 'players',
              filter: `room=eq.${roomCode}`
            },
            async (payload) => {

              if (payload.new.status === 'success' || payload.new.status === 'failure') {
                await checkAndProceedMissionResult();
              }
            }
          )
          .subscribe((status) => {

            if (status === 'SUBSCRIBED') {
              checkAndProceedMissionResult();
            }
          });
      }
    });
  }
  else
  {
    title2.innerHTML = 
    "Missione approvata con " + votes[0] + " voti favorevoli e " + votes[1] + " voti contrari.<br>" +
    "Aspetta che " + missionPlayers.join(", ") + " facciano la missione.";
  }

}

function voteMission() {
  const playerList = document.getElementById('playerList');
  playerList.innerHTML = '';

  const title2 = document.querySelector('h2');
  title2.textContent = "Vuoi approvare la missione con " + missionPlayers.join(", ") + "?";

  const voteContainer = document.createElement('div');
  voteContainer.style.display = 'flex';
  voteContainer.style.justifyContent = 'center';
  voteContainer.style.gap = '50px';
  voteContainer.style.marginTop = '30px';

  const thumbsUp = document.createElement('img');
  thumbsUp.src = 'thumbsup.png';
  thumbsUp.alt = 'Approva';
  thumbsUp.classList.add('vote-icon');

  const thumbsDown = document.createElement('img');
  thumbsDown.src = 'thumbsdown.png';
  thumbsDown.alt = 'Rifiuta';
  thumbsDown.classList.add('vote-icon');

  voteContainer.appendChild(thumbsUp);
  voteContainer.appendChild(thumbsDown);
  playerList.appendChild(voteContainer);

  const confirmVoteBtn = document.createElement('button');
  confirmVoteBtn.textContent = "Conferma voto";
  confirmVoteBtn.classList.add('button');
  confirmVoteBtn.disabled = true;
  confirmVoteBtn.style.marginTop = '30px';
  playerList.appendChild(confirmVoteBtn);

  let selectedVote = null;
  [thumbsUp, thumbsDown].forEach(img => {
    img.addEventListener('click', () => {
      thumbsUp.classList.remove('selected-vote');
      thumbsDown.classList.remove('selected-vote');
      img.classList.add('selected-vote');
      selectedVote = img === thumbsUp ? 'approve' : 'reject';
      confirmVoteBtn.disabled = false;
    });
  });

  confirmVoteBtn.addEventListener('click', async () => {
    console.log("Hai votato:", selectedVote);
    confirmVoteBtn.disabled = true;
    confirmVoteBtn.textContent = "Voto inviato!";
    confirmVoteBtn.remove();
    thumbsUp.style.pointerEvents = 'none';
    thumbsDown.style.pointerEvents = 'none';
    
    if (selectedVote === "approve")
      title2.textContent = "Hai approvato la missione con " + missionPlayers.join(", ") + ".";
    else
      title2.textContent = "Hai rifiutato la missione con " + missionPlayers.join(", ") + ".";
    
    const success2 = await setStatusVoted(roomCode, nickname, selectedVote);
    
    if (playersData[0].name === nickname)
    {
      async function checkAndProceedVoting() {
        if (alreadyProcessedVoting) return;
        
        const result = await checkPlayersStatus2();
        if (result) {
          alreadyProcessedVoting = true;
          
          if (voteApproveRejectSub) {
            await supabase.removeChannel(voteApproveRejectSub);
            voteApproveRejectSub = null;
          }
          
          if (result == 1)
          {
            console.log("votato sì");
            setStatusVoted(roomCode, nickname, 'mission');
            voteContainer.remove();
            thumbsUp.remove();
            thumbsDown.remove();
            playMission();
          }
          else
          {
            console.log("votato no");
            
            if (roundChangeSub) {
              await supabase.removeChannel(roundChangeSub);
              roundChangeSub = null;
            }
            
            const check2 = await setRound();
            window.location.replace("rejected.html?roomCode=" + roomCode + "&player=" + nickname);
          }
        }
      }

      voteApproveRejectSub = supabase
        .channel('vote-approve-reject-' + roomCode)
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'players',
            filter: `room=eq.${roomCode}`
          },
          async (payload) => {
            if (payload.new.status === 'approve' || payload.new.status === 'reject') {
              await checkAndProceedVoting();
            }
          }
        )
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            checkAndProceedVoting();
          }
        });
    }
    else
    {
      async function checkAndProceedMissionStart() {
        if (alreadyProcessedMissionStart) return;
        
        const result3 = await checkPlayersStatus3();
        if (result3)
        {
          console.log("votato sì");
          alreadyProcessedMissionStart = true;
          
          if (missionStatusSub) {
            await supabase.removeChannel(missionStatusSub);
            missionStatusSub = null;
          }
          
          voteContainer.remove();
          thumbsUp.remove();
          thumbsDown.remove();
          playMission();
        }
      }

      missionStatusSub = supabase
        .channel('mission-status-' + roomCode)
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'players',
            filter: `room=eq.${roomCode}`
          },
          async (payload) => {
    
            if (payload.new.status === 'mission') {
              await checkAndProceedMissionStart();
            }
          }
        )
        .subscribe((status) => {

          if (status === 'SUBSCRIBED') {
            checkAndProceedMissionStart();
          }
        });
    }
  });
}

async function readLevel() {
  try {
    const { data, error } = await supabase
      .from('rooms_id')
      .select('results')
      .eq('room_code', roomCode);

    if (error) {
      console.error('Errore nella query:', error);
      return 0;
    } else {
      return data[0]?.results.length || 0;
    }
  } catch (err) {
    console.error('Errore:', err);
    return 0;
  }
}

async function setupRoundChangeSubscription() {
  roundChangeSub = supabase
    .channel('round-change-' + roomCode)
    .on(
      'postgres_changes',
      {
        event: 'UPDATE',
        schema: 'public',
        table: 'rooms_id',
        filter: `room_code=eq.${roomCode}`
      },
      async (payload) => {
        const newRound = payload.new.round;
        if (newRound !== round) {
          console.log('Round cambiato da', round, 'a', newRound);
          
          if (missionSelectedSub) await supabase.removeChannel(missionSelectedSub);
          if (voteApproveRejectSub) await supabase.removeChannel(voteApproveRejectSub);
          if (missionStatusSub) await supabase.removeChannel(missionStatusSub);
          if (missionResultSub) await supabase.removeChannel(missionResultSub);
          if (roundChangeSub) await supabase.removeChannel(roundChangeSub);
          
          if (payload.new.results && payload.new.results.length > level) {
            window.location.replace("result.html?roomCode=" + roomCode + "&player=" + nickname);
          } else {
            window.location.replace("rejected.html?roomCode=" + roomCode + "&player=" + nickname);
          }
        }
      }
    )
    .subscribe((status) => {;
    });
}

getPlayersByRoom().then(async players => {
  round = await readRound();
  level = await readLevel();
  console.log('Level attuale:', level);
  
  await setupRoundChangeSubscription();
  
  const role = playersData.find(p => p.name === nickname)?.role;
  const title = document.querySelector('h1');
  title.textContent = nickname + " sei " + role;
  
  if (playersData[round].name === nickname)
  {
    // SEI IL LEADER
    confermaButton.style.visibility = 'visible';
    const title2 = document.querySelector('h2');
    title2.textContent = "Scegli " + nec[playersData.length][level] + " persone da mandare in missione."
    
    playersData.forEach(player => {
      const li = document.createElement('li');
      li.textContent = player.name;
      li.classList.add('player-item');
      
      li.addEventListener('click', () => {
        if (missionPlayers.includes(player.name)) {
          missionPlayers = missionPlayers.filter(p => p !== player.name);
          li.classList.remove('selected');
        } else {
          if (missionPlayers.length < nec[playersData.length][level]) {
            missionPlayers.push(player.name);
            li.classList.add('selected');
          } else {
            alert('Puoi selezionare solo ' + nec[playersData.length][level] + ' persone per questa missione!');
          }
        }
        missionPlayers.sort((a, b) => a.localeCompare(b, 'it', { sensitivity: 'base' }));
        confermaButton.disabled = missionPlayers.length != nec[playersData.length][level];
        console.log("Giocatori selezionati:", missionPlayers);
      });

      playerList.appendChild(li);
    });
  }
  else
  {
    // NON SEI IL LEADER
    const title2 = document.querySelector('h2');
    title2.textContent = "Aspetta che " + playersData[round].name + " scelga " + nec[playersData.length][level] + " giocatori da mandare in missione.";
    async function checkAndProceedMissionSelection() {
      if (alreadyProcessedMissionSelection) return;
      
      const count = await checkPlayersStatus();
      if (count > 0) {
        console.log("Giocatori selezionati:", missionPlayers);
        alreadyProcessedMissionSelection = true;
        
        // Pulisci subscription
        if (missionSelectedSub) {
          await supabase.removeChannel(missionSelectedSub);
          missionSelectedSub = null;
        }
        
        voteMission();
      }
    }

    missionSelectedSub = supabase
      .channel('mission-selection-' + roomCode)
      .on(
        'postgres_changes',
        {
          event: 'UPDATE',
          schema: 'public',
          table: 'players',
          filter: `room=eq.${roomCode}`
        },
        async (payload) => {
          if (payload.new.mission === true) {
            await checkAndProceedMissionSelection();
          }
        }
      )
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          checkAndProceedMissionSelection();
        }
      });
  }
});

async function setStatusSelected(roomCode, missionPlayers) {
  try {
    const { data, error } = await supabase
      .from('players')
      .update({ mission: true })
      .eq('room', roomCode)
      .in('name', missionPlayers)
      .select();

    if (error) throw error;

    if (!data || data.length === 0) {
      console.log("Nessun player trovato con quel roomCode e nomi corrispondenti");
      return false;
    }

    console.log("Status aggiornato a 'selected' per i giocatori:", missionPlayers);
    return true;
  } catch (err) {
    console.error("Errore aggiornando lo status:", err);
    return null;
  }
}

confermaButton.addEventListener('click', async () => {
  console.log("Missione confermata con i giocatori:", missionPlayers);

  const success = await setStatusSelected(roomCode, missionPlayers);

  if (success) {
    confermaButton.disabled = true;
    confermaButton.textContent = "Missione inviata!";
    confermaButton.style.visibility = 'hidden';
    voteMission();
  }
});

</script>
